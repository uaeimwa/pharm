<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMS Pharmacy</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Social Media & UI Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <canvas id="capsule-canvas"></canvas>

    <!-- Header Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <!-- Triple-clicking logo triggers hidden dashboard -->
            <a href="#" class="logo" id="secret-trigger">AMS <span class="teal-glow">Pharmacy</span></a>
            <p class="tagline">Premium Pharma & Cosmetics</p>
            
            <!-- Dark / Light Mode Toggle Button -->
            <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()">
                <i class="fas fa-moon" id="theme-icon"></i>
                <span id="theme-text">Dark</span>
            </button>
        </div>
    </nav>

    <!-- Category Filter Bar -->
    <div class="category-bar">
        <button class="cat-btn active" onclick="filterCategory('All', this)">All / الكل</button>
        <button class="cat-btn" onclick="filterCategory('Pharma', this)">Pharma / أدوية</button>
        <button class="cat-btn" onclick="filterCategory('Cosmetics', this)">Cosmetics / تجميل</button>
        <button class="cat-btn" onclick="filterCategory('Skin Care', this)">Skin Care / بشرة</button>
        <button class="cat-btn" onclick="filterCategory('Hair Care', this)">Hair Care / شعر</button>
        <button class="cat-btn" onclick="filterCategory('Supplements', this)">Supplements / مكملات</button>
    </div>

    <!-- Main Content Grid -->
    <main class="container">
        <div id="product-grid" class="product-grid">
            <!-- Generated dynamically by JS -->
        </div>
    </main>

    <!-- Glowing Social Footer -->
    <footer class="social-footer">
        <h3>Connect With Us</h3>
        <div class="social-icons">
            <a href="https://www.tiktok.com/@ams_pharmacy_blida" target="_blank" class="icon tiktok" title="TikTok"><i class="fab fa-tiktok"></i></a>
            <a href="https://www.instagram.com/ams_pharmacy_blida/" target="_blank" class="icon instagram" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://www.facebook.com/profile.php?id=61591569766818" target="_blank" class="icon facebook" title="Facebook"><i class="fab fa-facebook-f"></i></a>
        </div>
        <p>&copy; 2026 AMS Pharmacy. All Rights Reserved.</p>
    </footer>

    <script>
    let allProducts = [];
    const grid = document.getElementById('product-grid');

    // Theme Switcher Logic
    function applyTheme(theme) {
        const icon = document.getElementById('theme-icon');
        const text = document.getElementById('theme-text');
        
        if (theme === 'light') {
            document.body.classList.add('light-mode');
            icon.className = 'fas fa-sun';
            text.textContent = 'Light';
        } else {
            document.body.classList.remove('light-mode');
            icon.className = 'fas fa-moon';
            text.textContent = 'Dark';
        }
    }

    function toggleTheme() {
        const isLight = document.body.classList.contains('light-mode');
        const newTheme = isLight ? 'dark' : 'light';
        localStorage.setItem('ams_theme', newTheme);
        applyTheme(newTheme);
    }

    const savedTheme = localStorage.getItem('ams_theme') || 'dark';
    applyTheme(savedTheme);

    // Database Connection
    const dbRequest = indexedDB.open("AMSPharmacyDB", 1);
    let db;

    dbRequest.onupgradeneeded = function(e) {
        db = e.target.result;
        if (!db.objectStoreNames.contains("inventory")) {
            db.createObjectStore("inventory", { keyPath: "id", autoIncrement: true });
        }
    };

    dbRequest.onsuccess = function(e) {
        db = e.target.result;
        loadLiveCatalog();
    };

    function loadLiveCatalog() {
        if (!db) return;
        
        const transaction = db.transaction(["inventory"], "readonly");
        const store = transaction.objectStore("inventory");
        allProducts = [];

        store.openCursor().onsuccess = function(event) {
            const cursor = event.target.result;
            if (cursor) {
                allProducts.push(cursor.value);
                cursor.continue();
            } else {
                renderStore(allProducts);
            }
        };
    }

    function filterCategory(category, btnElement) {
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
        if (btnElement) btnElement.classList.add('active');

        if (category === 'All') {
            renderStore(allProducts);
        } else {
            const filtered = allProducts.filter(p => p.category === category);
            renderStore(filtered);
        }
    }

    function renderStore(products) {
        grid.innerHTML = '';
        if(!products || products.length === 0) {
            grid.innerHTML = `
                <div style="grid-column: 1/-1; text-align:center; color: #94a3b8; margin: 4rem 0;">
                    <p>No products available in this category.</p>
                </div>
            `;
            return;
        }

        products.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.setAttribute('onclick', `window.open('product.html?id=${product.id}', '_blank')`);
            card.style.cursor = "pointer";
            
            let imageElements = product.images.map((img, idx) => `
                <img src="${img}" class="slide-${product.id} ${idx === 0 ? 'active' : ''}" alt="${product.name}">
            `).join('');

            let dotElements = product.images.map((_, idx) => `
                <span class="dot dot-${product.id} ${idx === 0 ? 'active' : ''}" onclick="event.stopPropagation(); changeImage(${product.id}, ${idx})"></span>
            `).join('');

            card.innerHTML = `
                <div class="image-viewer">
                    ${imageElements}
                    <div class="slider-dots">${dotElements}</div>
                </div>
                <div class="card-content">
                    <div class="teal-line"></div>
                    <span style="font-size:0.75rem; color:#00f2fe; text-transform:uppercase; font-weight:bold;">${product.category || 'Pharma'}</span>
                    <h3 style="margin: 0.3rem 0;">${product.name}</h3>
                    <div class="price">${product.price}</div>
                    <div class="tap-hint" style="margin-top:0.8rem; font-size:0.8rem; color:#00f2fe;">Click to see full specifications →</div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    window.changeImage = function(productId, targetIdx) {
        const slides = document.querySelectorAll(`.slide-${productId}`);
        const dots = document.querySelectorAll(`.dot-${productId}`);
        slides.forEach(img => img.classList.remove('active'));
        dots.forEach(dot => dot.classList.remove('active'));
        slides[targetIdx].classList.add('active');
        dots[targetIdx].classList.add('active');
    };

    // Secret dashboard trigger (click logo 3 times)
    let clickCount = 0;
    document.getElementById('secret-trigger').addEventListener('click', (e) => {
        e.preventDefault();
        clickCount++;
        if(clickCount >= 3) {
            window.location.href = 'dashboard.html';
        }
        setTimeout(() => { clickCount = 0; }, 2000);
    });
    </script>

    const canvas = document.getElementById('capsule-canvas');
    const ctx = canvas.getContext('2d');

<script>

  authDomain: "ams-pharmacy.firebaseapp.com",
  projectId: "ams-pharmacy",

  measurementId: "G-5LZZGHG2EP"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// جلب المنتجات وعرضها من Firebase
function displayMainProducts(categoryFilter = 'All') {
    const grid = document.getElementById('product-grid'); // تم تصحيح الـ ID
    if(!grid) return;

    db.collection("inventory").get().then((querySnapshot) => {
        allProducts = [];
        querySnapshot.forEach((doc) => {
            const data = doc.data();
            allProducts.push({ id: doc.id, ...data });
        });

        if (categoryFilter === 'All') {
            renderStore(allProducts);
        } else {
            const filtered = allProducts.filter(p => p.category === categoryFilter);
            renderStore(filtered);
        }
    }).catch(err => {
        console.error("Firebase Error:", err);
    });
}

// ربط الفلترة بـ Firebase
function filterCategory(category, btnElement) {
    document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
    if (btnElement) btnElement.classList.add('active');
    displayMainProducts(category);
}

document.addEventListener('DOMContentLoaded', () => {
    displayMainProducts('All');
});
</script>
</body>
</html>
