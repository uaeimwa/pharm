<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMS Pharmacy - الواجهة الرئيسية</title>
    <link rel="stylesheet" href="style.css?v=1.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Grid Layout for Products */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 2rem;
        }

        .product-card {
            background: var(--card-bg, rgba(255, 255, 255, 0.05));
            border: 1px solid var(--card-border, rgba(255, 255, 255, 0.1));
            border-radius: 14px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.15);
        }

        .product-image {
            position: relative;
            width: 100%;
            height: 200px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1rem;
            background: #111;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .stock-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .stock-badge.in-stock {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
        }

        .stock-badge.out-stock {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .product-info h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary, #fff);
        }

        .product-info .category {
            font-size: 0.8rem;
            color: var(--accent-color, #00f2fe);
            display: block;
            margin-bottom: 0.5rem;
        }

        .product-info .price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 1rem;
        }

        .btn-details {
            display: block;
            text-align: center;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #000;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: opacity 0.3s;
        }

        .btn-details:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <canvas id="capsule-canvas"></canvas>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">AMS <span class="teal-glow">Pharmacy</span></a>
            <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()">
                <i class="fas fa-moon" id="theme-icon"></i>
                <span id="theme-text">Dark</span>
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container" style="position: relative; z-index: 2; margin-top: 2rem;">
        <h1 style="text-align: center; color: var(--text-primary, #fff); margin-bottom: 1rem;">
            كتالوج المنتجات والمخزون
        </h1>

        <!-- Grid Container Where Products Will Be Rendered -->
        <div id="products-grid" class="products-grid">
            <div style="text-align: center; grid-column: 1/-1; color: var(--accent-color, #00f2fe); padding: 3rem 0;">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p style="margin-top: 1rem;">جاري تحميل المنتجات من الستوك...</p>
            </div>
        </div>
    </main>

    <!-- Canvas Animation Background -->
    <script>
    const canvas = document.getElementById('capsule-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Capsule {
        constructor(letter) {
            this.letter = letter;
            this.reset(true);
        }

        reset(initial = false) {
            this.x = Math.random() * width;
            this.y = initial ? Math.random() * height : height + 60;
            this.vx = (Math.random() - 0.5) * 0.6;
            this.vy = -(Math.random() * 0.8 + 0.4);
            this.size = Math.random() * 15 + 25;
            this.length = this.size * 2.2;
            this.angle = (Math.random() - 0.5) * Math.PI;
            this.rotationSpeed = (Math.random() - 0.5) * 0.015;
            this.opacity = Math.random() * 0.45 + 0.4;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.angle += this.rotationSpeed;
            if (this.y < -80 || this.x < -80 || this.x > width + 80) this.reset();
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            ctx.globalAlpha = this.opacity;

            const w = this.length;
            const h = this.size;
            const r = h / 2;

            ctx.beginPath();
            ctx.arc(-w/2 + r, 0, r, Math.PI / 2, (3 * Math.PI) / 2);
            ctx.lineTo(0, -r);
            ctx.lineTo(0, r);
            ctx.closePath();
            ctx.fillStyle = '#00f2fe';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(w/2 - r, 0, r, -Math.PI / 2, Math.PI / 2);
            ctx.lineTo(0, r);
            ctx.lineTo(0, -r);
            ctx.closePath();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.fill();

            ctx.restore();
        }
    }

    const letters = ['A', 'M', 'S'];
    const capsules = [];
    for (let i = 0; i < 20; i++) capsules.push(new Capsule(letters[i % letters.length]));

    function animate() {
        ctx.clearRect(0, 0, width, height);
        capsules.forEach(capsule => { capsule.update(); capsule.draw(); });
        requestAnimationFrame(animate);
    }
    animate();
    </script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Main Logic Script -->
    <script>
    // 1. Theme Switcher
    function applyTheme(theme) {
        const icon = document.getElementById('theme-icon');
        const text = document.getElementById('theme-text');
        if (theme === 'light') {
            document.body.classList.add('light-mode');
            if(icon) icon.className = 'fas fa-sun';
            if(text) text.textContent = 'Light';
        } else {
            document.body.classList.remove('light-mode');
            if(icon) icon.className = 'fas fa-moon';
            if(text) text.textContent = 'Dark';
        }
    }
    function toggleTheme() {
        const isLight = document.body.classList.contains('light-mode');
        const newTheme = isLight ? 'dark' : 'light';
        localStorage.setItem('ams_theme', newTheme);
        applyTheme(newTheme);
    }
    applyTheme(localStorage.getItem('ams_theme') || 'dark');

    // 2. Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCsAxSL_6n-L4J2I3XCupS9K7Z_u3dFf-N",
      authDomain: "ams-pharmacy.firebaseapp.com",
      projectId: "ams-pharmacy",
      storageBucket: "ams-pharmacy.firebasestorage.app",
      messagingSenderId: "989475311469",
      appId: "1:989475311469:web:969dc1bb43da869739b464",
      measurementId: "G-5LZZGHG2EP"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 3. Fetching Inventory Products
    db.collection("inventory").get().then((querySnapshot) => {
        const productsContainer = document.getElementById('products-grid');
        
        if (!productsContainer) return;
        productsContainer.innerHTML = ''; 

        if (querySnapshot.empty) {
            productsContainer.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">لا توجد منتجات متوفرة حالياً في الستوك.</p>';
            return;
        }

        querySnapshot.forEach((doc) => {
            const product = doc.data();
            const productId = doc.id;

            // Flexible handling for stock fields
            const stockValue = product.stock ?? product.quantity ?? product.inStock ?? 0;
            const isAvailable = Number(stockValue) > 0 || stockValue === "available" || stockValue === true;

            // Image handling
            let imgUrl = 'https://via.placeholder.com/300x200?text=No+Image';
            if (Array.isArray(product.images) && product.images.length > 0) {
                imgUrl = product.images[0];
            } else if (typeof product.images === 'string' && product.images !== '') {
                imgUrl = product.images;
            } else if (product.image) {
                imgUrl = product.image;
            }

            // Construct Card Element
            const productCard = `
                <div class="product-card">
                    <div class="product-image">
                        <img src="${imgUrl}" alt="${product.name || 'منتج'}">
                        <span class="stock-badge ${isAvailable ? 'in-stock' : 'out-stock'}">
                            ${isAvailable ? 'متوفر في الستوك' : 'غير متوفر'}
                        </span>
                    </div>
                    <div class="product-info">
                        <span class="category">${product.category || 'عام'}</span>
                        <h3>${product.name || 'منتج بدون اسم'}</h3>
                        <p class="price">${product.price || ''}</p>
                        <a href="product.html?id=${productId}" class="btn-details">عرض التفاصيل</a>
                    </div>
                </div>
            `;

            productsContainer.innerHTML += productCard;
        });
    }).catch((error) => {
        console.error("خطأ في جلب المنتجات من الستوك:", error);
        document.getElementById('products-grid').innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: #ef4444;">حدث خطأ أثناء تحميل البيانات من قاعدة البيانات.</p>';
    });
    </script>
</body>
</html>
