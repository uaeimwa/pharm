<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMS Pharmacy - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="padding: 2rem 1rem;">
    <div style="max-width: 900px; margin: 0 auto; color: #fff;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1 style="color: #00f2fe;">AMS Pharmacy Stock Dashboard</h1>
            <a href="index.html" style="color: #00f2fe; text-decoration: none; border: 1px solid #00f2fe; padding: 0.5rem 1rem; border-radius: 6px;">← Back to Store</a>
        </div>

        <!-- Add New Product Card -->
        <div style="background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(0, 242, 254, 0.3); padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem;">
            <h2 style="color: #00f2fe; margin-top: 0;">Add New Product</h2>
            <form id="add-product-form">
                <div style="margin-bottom: 1rem;">
                    <label>Product Name:</label>
                    <input type="text" id="product-name" required style="width: 100%; padding: 0.8rem; margin-top: 0.3rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(0,242,254,0.3); color: #fff; border-radius: 8px;">
                </div>

                <div style="display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 200px;">
                        <label>Price:</label>
                        <input type="text" id="product-price" placeholder="e.g. 1,200 DZD" required style="width: 100%; padding: 0.8rem; margin-top: 0.3rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(0,242,254,0.3); color: #fff; border-radius: 8px;">
                    </div>
                    
                    <div style="flex: 1; min-width: 200px;">
                        <label>Category:</label>
                        <select id="product-category" required style="width: 100%; padding: 0.8rem; margin-top: 0.3rem; background: rgba(15,23,42,0.95); border: 1px solid rgba(0,242,254,0.3); color: #fff; border-radius: 8px;">
                            <option value="Pharma">Pharma / أدوية</option>
                            <option value="Cosmetics">Cosmetics / تجميل</option>
                            <option value="Skin Care">Skin Care / عناية بالبشرة</option>
                            <option value="Hair Care">Hair Care / عناية بالشعر</option>
                            <option value="Supplements">Supplements / مكملات غذائية</option>
                        </select>
                    </div>
                </div>

                <div style="margin-bottom: 1rem;">
                    <label>Product Specifications & Description:</label>
                    <textarea id="product-desc" rows="3" placeholder="Enter key features, size, dosage, or active ingredients..." style="width: 100%; padding: 0.8rem; margin-top: 0.3rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(0,242,254,0.3); color: #fff; border-radius: 8px;"></textarea>
                </div>

                <div style="margin-bottom: 1.5rem;">
                    <label>Product Images (Upload one or multiple):</label>
                    <input type="file" id="product-images" accept="image/*" multiple required style="width: 100%; margin-top: 0.3rem; color: #94a3b8;">
                </div>

                <button type="submit" style="width: 100%; padding: 0.8rem; background: #00f2fe; color: #0f172a; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem;">Add Product to Stock</button>
            </form>
        </div>

        <!-- Inventory Management List -->
        <div style="background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(0, 242, 254, 0.3); padding: 1.5rem; border-radius: 12px;">
            <h2 style="color: #00f2fe; margin-top: 0;">Current Inventory</h2>
            <div id="inventory-list"></div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 9999; justify-content: center; align-items: center;">
        <div style="background: #0f172a; border: 1px solid #00f2fe; padding: 2rem; border-radius: 12px; width: 90%; max-width: 500px; color: #fff; box-shadow: 0 0 25px rgba(0,242,254,0.3);">
            <h3 style="color: #00f2fe; margin-top: 0;">Edit Product / تعديل المنتج</h3>
            <input type="hidden" id="edit-product-id">
            
            <div style="margin-bottom: 1rem;">
                <label>Product Name:</label>
                <input type="text" id="edit-name" style="width: 100%; padding: 0.6rem; margin-top: 0.4rem; background: rgba(255,255,255,0.05); border: 1px solid #00f2fe; color: #fff; border-radius: 6px;">
            </div>

            <div style="margin-bottom: 1rem;">
                <label>Price:</label>
                <input type="text" id="edit-price" style="width: 100%; padding: 0.6rem; margin-top: 0.4rem; background: rgba(255,255,255,0.05); border: 1px solid #00f2fe; color: #fff; border-radius: 6px;">
            </div>

            <div style="margin-bottom: 1rem;">
                <label>Category:</label>
                <select id="edit-category" style="width: 100%; padding: 0.6rem; margin-top: 0.4rem; background: rgba(15,23,42,0.95); border: 1px solid #00f2fe; color: #fff; border-radius: 6px;">
                    <option value="Pharma">Pharma / أدوية</option>
                    <option value="Cosmetics">Cosmetics / تجميل</option>
                    <option value="Skin Care">Skin Care / عناية بالبشرة</option>
                    <option value="Hair Care">Hair Care / عناية بالشعر</option>
                    <option value="Supplements">Supplements / مكملات غذائية</option>
                </select>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label>Specifications & Description:</label>
                <textarea id="edit-desc" rows="4" style="width: 100%; padding: 0.6rem; margin-top: 0.4rem; background: rgba(255,255,255,0.05); border: 1px solid #00f2fe; color: #fff; border-radius: 6px;"></textarea>
            </div>

            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button onclick="closeEditModal()" style="padding: 0.6rem 1.2rem; background: #64748b; color: #fff; border: none; border-radius: 6px; cursor: pointer;">Cancel</button>
                <button onclick="saveProductChanges()" style="padding: 0.6rem 1.2rem; background: #00f2fe; color: #0f172a; font-weight: bold; border: none; border-radius: 6px; cursor: pointer;">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
    const dbRequest = indexedDB.open("AMSPharmacyDB", 1);
    let db;

    dbRequest.onupgradeneeded = function(e) {
        db = e.target.result;
        if (!db.objectStoreNames.contains("inventory")) {
            db.createObjectStore("inventory", { keyPath: "id", autoIncrement: true });
        }
    };

    dbRequest.onsuccess = function(e) {
        db = e.target.result;
        loadLiveCatalog();
    };

    function loadLiveCatalog() {
        if (!db) return;
        const transaction = db.transaction(["inventory"], "readonly");
        const store = transaction.objectStore("inventory");
        const items = [];

        store.openCursor().onsuccess = function(event) {
            const cursor = event.target.result;
            if (cursor) {
                items.push(cursor.value);
                cursor.continue();
            } else {
                renderInventoryTable(items);
            }
        };
    }

    function renderInventoryTable(items) {
        const container = document.getElementById('inventory-list');
        container.innerHTML = '';

        if(items.length === 0) {
            container.innerHTML = `<p style="color: #64748b;">No products in database.</p>`;
            return;
        }

        items.forEach(product => {
            const itemDiv = document.createElement('div');
            itemDiv.style.cssText = "display: flex; align-items: center; justify-content: space-between; padding: 1rem 0; border-bottom: 1px solid rgba(0,242,254,0.15); flex-wrap: wrap; gap: 10px;";
            
            itemDiv.innerHTML = `
                <div>
                    <strong style="color: #00f2fe; font-size: 1.1rem;">${product.name}</strong> 
                    <span style="color: #94a3b8; margin-left: 8px;">(${product.price})</span>
                    <span style="font-size: 0.75rem; background: rgba(0,242,254,0.15); color: #00f2fe; padding: 2px 8px; border-radius: 12px; margin-left: 8px;">${product.category || 'Pharma'}</span>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button onclick="openEditModal(${product.id})" style="background: #eab308; color: #0f172a; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-weight: bold;">
                        <i class="fas fa-edit"></i> Edit
                    </button>
                    <button onclick="deleteProduct(${product.id})" style="background: #ef4444; color: #fff; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer;">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </div>
            `;
            container.appendChild(itemDiv);
        });
    }

    // Convert uploaded image files to Base64 strings
    function convertFilesToBase64(files) {
        return Promise.all(Array.from(files).map(file => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }));
    }

    // Add Product Form Handler
    document.getElementById('add-product-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const files = document.getElementById('product-images').files;
        if(files.length === 0) return;

        const imageBase64List = await convertFilesToBase64(files);

        const newProduct = {
            name: document.getElementById('product-name').value,
            price: document.getElementById('product-price').value,
            category: document.getElementById('product-category').value,
            description: document.getElementById('product-desc').value,
            images: imageBase64List
        };

        const transaction = db.transaction(["inventory"], "readwrite");
        const store = transaction.objectStore("inventory");
        store.add(newProduct);

        transaction.oncomplete = function() {
            document.getElementById('add-product-form').reset();
            loadLiveCatalog();
        };
    });

    // Modal Edit Functions
    function openEditModal(id) {
        const transaction = db.transaction(["inventory"], "readonly");
        const store = transaction.objectStore("inventory");
        const request = store.get(id);

        request.onsuccess = function() {
            const product = request.result;
            if(product) {
                document.getElementById('edit-product-id').value = product.id;
                document.getElementById('edit-name').value = product.name;
                document.getElementById('edit-price').value = product.price;
                document.getElementById('edit-category').value = product.category || 'Pharma';
                document.getElementById('edit-desc').value = product.description || '';
                document.getElementById('edit-modal').style.display = 'flex';
            }
        };
    }

    function closeEditModal() {
        document.getElementById('edit-modal').style.display = 'none';
    }

    function saveProductChanges() {
        const id = parseInt(document.getElementById('edit-product-id').value);
        const transaction = db.transaction(["inventory"], "readwrite");
        const store = transaction.objectStore("inventory");
        const request = store.get(id);

        request.onsuccess = function() {
            const existingData = request.result;
            if(existingData) {
                existingData.name = document.getElementById('edit-name').value;
                existingData.price = document.getElementById('edit-price').value;
                existingData.category = document.getElementById('edit-category').value;
                existingData.description = document.getElementById('edit-desc').value;

                store.put(existingData).onsuccess = function() {
                    closeEditModal();
                    loadLiveCatalog();
                };
            }
        };
    }

    function deleteProduct(id) {
        if(confirm("Are you sure you want to delete this product?")) {
            const transaction = db.transaction(["inventory"], "readwrite");
            const store = transaction.objectStore("inventory");
            store.delete(id).onsuccess = function() {
                loadLiveCatalog();
            };
        }
    }
    </script>
</body>
</html>
