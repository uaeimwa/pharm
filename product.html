<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج - AMS Pharmacy</title>
    <link rel="stylesheet" href="style.css?v=1.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .product-detail-wrapper {
            max-width: 900px;
            margin: 2rem auto;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(10px);
        }

        /* 1. Top Section: Header Info */
        .product-header-section {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1.5rem;
        }

        .badge-cat {
            display: inline-block;
            background: rgba(0, 242, 254, 0.15);
            color: var(--accent-color);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 0.8rem;
        }

        .product-title {
            font-size: 2.2rem;
            color: var(--text-primary);
            margin-bottom: 0.8rem;
            line-height: 1.3;
        }

        .product-price-tag {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-color);
        }

        /* 2. Middle Section: Main Image & Thumbnails */
        .image-gallery-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2.5rem;
        }

        .main-image-box {
            width: 100%;
            max-width: 550px;
            height: 400px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            margin-bottom: 1rem;
            cursor: zoom-in;
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .main-image-box:hover {
            transform: scale(1.01);
        }

        .main-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumbnails-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .thumbnail {
            width: 75px;
            height: 75px;
            border-radius: 10px;
            cursor: pointer;
            object-fit: cover;
            border: 2px solid transparent;
            opacity: 0.7;
            transition: all 0.3s ease;
        }

        .thumbnail.active, .thumbnail:hover {
            border-color: var(--accent-color);
            opacity: 1;
            transform: translateY(-2px);
        }

        /* 3. Bottom Section: Specifications */
        .specs-section {
            border-top: 1px solid var(--card-border);
            padding-top: 1.5rem;
        }

        .specs-title {
            color: var(--accent-color);
            font-size: 1.4rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .specs-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            color: var(--text-primary);
            line-height: 1.8;
            white-space: pre-line;
            font-size: 1rem;
        }

        /* 4. Zoom Lightbox Modal */
        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }

        .lightbox-modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.4);
            border: 1px solid var(--card-border);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <canvas id="capsule-canvas"></canvas>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">AMS <span class="teal-glow">Pharmacy</span></a>
            <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()">
                <i class="fas fa-moon" id="theme-icon"></i>
                <span id="theme-text">Dark</span>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <a href="index.html" style="color: var(--accent-color); text-decoration: none; font-weight: bold;">
            ← العودة للمتجر / Back to Catalog
        </a>

        <div id="product-details" class="product-detail-wrapper">
            <p style="color: var(--text-secondary); text-align: center;">جاري تحميل تفاصيل المنتج...</p>
        </div>
    </main>

    <!-- Image Zoom Lightbox Modal -->
    <div id="image-lightbox" class="lightbox-modal" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Zoomed Product">
    </div>

    <script>
    // Theme Switcher
    function applyTheme(theme) {
        const icon = document.getElementById('theme-icon');
        const text = document.getElementById('theme-text');
        if (theme === 'light') {
            document.body.classList.add('light-mode');
            if(icon) icon.className = 'fas fa-sun';
            if(text) text.textContent = 'Light';
        } else {
            document.body.classList.remove('light-mode');
            if(icon) icon.className = 'fas fa-moon';
            if(text) text.textContent = 'Dark';
        }
    }
    function toggleTheme() {
        const isLight = document.body.classList.contains('light-mode');
        const newTheme = isLight ? 'dark' : 'light';
        localStorage.setItem('ams_theme', newTheme);
        applyTheme(newTheme);
    }
    applyTheme(localStorage.getItem('ams_theme') || 'dark');

    // Fetch Product Data
    const urlParams = new URLSearchParams(window.location.search);
    const productId = parseInt(urlParams.get('id'));

    const dbRequest = indexedDB.open("AMSPharmacyDB", 1);

    dbRequest.onsuccess = function(e) {
        const db = e.target.result;
        const transaction = db.transaction(["inventory"], "readonly");
        const store = transaction.objectStore("inventory");
        const request = store.get(productId);

        request.onsuccess = function() {
            const product = request.result;
            const container = document.getElementById('product-details');

            if (product) {
                const mainImg = (product.images && product.images.length > 0) ? product.images[0] : '';
                
                const thumbnailsHTML = (product.images || []).map((img, idx) => `
                    <img src="${img}" class="thumbnail ${idx === 0 ? 'active' : ''}" onclick="switchMainImage('${img}', this)" alt="thumb">
                `).join('');

                const specsText = product.description || product.specs || product.details || "لا توجد مواصفات إضافية مكتوبة لهذا المنتج حالياً.";

                container.innerHTML = `
                    <!-- 1. Name and Price ABOVE Pictures -->
                    <div class="product-header-section">
                        <span class="badge-cat">${product.category || 'Pharma'}</span>
                        <h1 class="product-title">${product.name}</h1>
                        <div class="product-price-tag">${product.price}</div>
                    </div>

                    <!-- 2. Main Image & Gallery -->
                    <div class="image-gallery-section">
                        <div class="main-image-box" onclick="openLightbox()">
                            <img id="current-main-img" src="${mainImg}" alt="${product.name}" title="اضغط للتكبير">
                        </div>
                        <div class="thumbnails-row">
                            ${thumbnailsHTML}
                        </div>
                    </div>

                    <!-- 3. Specifications UNDER Pictures -->
                    <div class="specs-section">
                        <h3 class="specs-title">
                            <i class="fas fa-list-check"></i> المواصفات والتفاصيل / Specifications:
                        </h3>
                        <div class="specs-box">
                            ${specsText}
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div style="text-align: center; color: #ef4444;">
                        <h2>المنتج غير موجود / Product Not Found</h2>
                    </div>
                `;
            }
        };
    };

    function switchMainImage(src, element) {
        document.getElementById('current-main-img').src = src;
        document.querySelectorAll('.thumbnail').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
    }

    // Lightbox Logic for Enlarging Images
    function openLightbox() {
        const currentSrc = document.getElementById('current-main-img').src;
        if(!currentSrc) return;
        document.getElementById('lightbox-img').src = currentSrc;
        document.getElementById('image-lightbox').style.display = 'flex';
    }

    function closeLightbox() {
        document.getElementById('image-lightbox').style.display = 'none';
    }
    </script>
    <!-- مكتبات Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCsAxSL_6n-L4J2I3XCupS9K7Z_u3dFf-N",
  authDomain: "ams-pharmacy.firebaseapp.com",
  projectId: "ams-pharmacy",
  storageBucket: "ams-pharmacy.firebasestorage.app",
  messagingSenderId: "989475311469",
  appId: "1:989475311469:web:969dc1bb43da869739b464",
  measurementId: "G-5LZZGHG2EP"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const urlParams = new URLSearchParams(window.location.search);
const productId = urlParams.get('id');

if (productId) {
    db.collection("inventory").doc(productId).get().then((doc) => {
        const container = document.getElementById('product-details');

        if (doc.exists) {
            const product = doc.data();
            const mainImg = (product.images && product.images.length > 0) ? product.images[0] : '';
            
            const thumbnailsHTML = (product.images || []).map((img, idx) => `
                <img src="${img}" class="thumbnail ${idx === 0 ? 'active' : ''}" onclick="switchMainImage('${img}', this)" alt="thumb">
            `).join('');

            const specsText = product.description || "لا توجد مواصفات إضافية مكتوبة لهذا المنتج حالياً.";

            container.innerHTML = `
                <div class="product-header-section">
                    <span class="badge-cat">${product.category || 'Pharma'}</span>
                    <h1 class="product-title">${product.name}</h1>
                    <div class="product-price-tag">${product.price}</div>
                </div>

                <div class="image-gallery-section">
                    <div class="main-image-box" onclick="openLightbox()">
                        <img id="current-main-img" src="${mainImg}" alt="${product.name}">
                    </div>
                    <div class="thumbnails-row">
                        ${thumbnailsHTML}
                    </div>
                </div>

                <div class="specs-section">
                    <h3 class="specs-title">
                        <i class="fas fa-list-check"></i> التفاصيل والمواصفات:
                    </h3>
                    <div class="specs-box">
                        ${specsText}
                    </div>
                </div>
            `;
        } else {
            container.innerHTML = `<h2 style="text-align:center; color:#ef4444;">المنتج غير موجود</h2>`;
        }
    });
}

function switchMainImage(src, element) {
    document.getElementById('current-main-img').src = src;
    document.querySelectorAll('.thumbnail').forEach(el => el.classList.remove('active'));
    element.classList.add('active');
}
</script>
</body>
</html>
</html>
