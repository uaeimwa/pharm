<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMS Pharmacy - Product Details</title>
    <!-- Linking your existing style sheet to maintain the clean, dark neon theme -->
    <link rel="stylesheet" href="style.css">
    <style>
        .detail-container {
            max-width: 1100px;
            margin: 4rem auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
        }
        @media (max-width: 768px) {
            .detail-container { grid-template-columns: 1fr; gap: 2rem; margin: 1rem auto; }
        }
        .product-gallery {
            position: relative;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }
        .product-gallery img {
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
            display: none;
        }
        .product-gallery img.active {
            display: block;
        }
        .gallery-thumbs {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }
        .thumb {
            width: 70px;
            height: 70px;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            object-fit: cover;
            background: rgba(255,255,255,0.05);
            opacity: 0.6;
        }
        .thumb.active {
            border-color: #00f2fe;
            opacity: 1;
        }
        .info-panel h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .detail-price {
            font-size: 1.8rem;
            font-weight: 700;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
            margin-bottom: 2rem;
        }
        .full-desc {
            color: #94a3b8;
            line-height: 1.8;
            font-size: 1.1rem;
            white-space: pre-wrap; /* Keeps your paragraphs and spacing intact */
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 1.5rem;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover { color: #00f2fe; }
    </style>
</head>
<body>

    <div class="detail-container">
        <!-- Left Side: Image Gallery -->
        <div>
            <a href="index.html" class="back-link">← Back to Catalog</a>
            <div class="product-gallery" id="main-gallery">
                <!-- Images will load here dynamically -->
            </div>
            <div class="gallery-thumbs" id="thumb-bar">
                <!-- Thumbnails will load here dynamically -->
            </div>
        </div>

        <!-- Right Side: Detailed Specifications -->
        <div class="info-panel" style="margin-top: 2.5rem;">
            <div class="teal-line" style="width: 60px; height: 4px; background: #00f2fe; margin-bottom: 1rem;"></div>
            <h1 id="det-name" class="teal-glow">Loading Product...</h1>
            <div id="det-price" class="detail-price">-- DZD</div>
            <div id="det-desc" class="full-desc">Please wait while details are retrieved...</div>
        </div>
    </div>

    <script>
        // Connect to database to fetch the clicked item
        const dbRequest = indexedDB.open("AMSPharmacyDB", 1);
        
        dbRequest.onsuccess = function(e) {
            const db = e.target.result;
            
            // Extract the product ID from the website link address bar URL
            const urlParams = new URLSearchParams(window.location.search);
            const productId = parseInt(urlParams.get('id'));

            if (!productId) {
                document.getElementById('det-name').textContent = "Product Not Found";
                return;
            }

            const transaction = db.transaction(["inventory"], "readonly");
            const store = transaction.objectStore("inventory");
            const getRequest = store.get(productId);

            getRequest.onsuccess = function(event) {
                const product = event.target.result;
                if (product) {
                    // Populate Text Contents
                    document.getElementById('det-name').textContent = product.name;
                    document.getElementById('det-price').textContent = product.price;
                    document.getElementById('det-desc').textContent = product.desc;
                    document.title = `${product.name} - AMS Pharmacy`;

                    // Populate Gallery
                    const gallery = document.getElementById('main-gallery');
                    const thumbBar = document.getElementById('thumb-bar');

                    product.images.forEach((imgSrc, idx) => {
                        // Create main images
                        const img = document.createElement('img');
                        img.src = imgSrc;
                        img.className = `view-slide ${idx === 0 ? 'active' : ''}`;
                        img.id = `slide-${idx}`;
                        gallery.appendChild(img);

                        // Create smaller thumbnail navigation boxes below it
                        if(product.images.length > 1) {
                            const thumb = document.createElement('img');
                            thumb.src = imgSrc;
                            thumb.className = `thumb ${idx === 0 ? 'active' : ''}`;
                            thumb.onclick = () => switchGalleryImage(idx);
                            thumbBar.appendChild(thumb);
                        }
                    });
                } else {
                    document.getElementById('det-name').textContent = "Product item no longer exists.";
                }
            };
        };

        function switchGalleryImage(targetIdx) {
            document.querySelectorAll('.view-slide').forEach(img => img.classList.remove('active'));
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));

            document.getElementById(`slide-${targetIdx}`).classList.add('active');
            if(document.querySelectorAll('.thumb')[targetIdx]) {
                document.querySelectorAll('.thumb')[targetIdx].classList.add('active');
            }
        }
    </script>
</body>
</html>
