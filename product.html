<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج - AMS Pharmacy</title>
    <link rel="stylesheet" href="style.css?v=1.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .product-detail-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            margin-top: 2rem;
        }

        .main-image-box {
            width: 100%;
            height: 380px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            margin-bottom: 1rem;
        }

        .main-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumbnails-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }

        .thumbnail {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            cursor: pointer;
            object-fit: cover;
            border: 2px solid transparent;
            opacity: 0.7;
            transition: all 0.3s ease;
        }

        .thumbnail.active, .thumbnail:hover {
            border-color: var(--accent-color);
            opacity: 1;
        }

        .badge-cat {
            display: inline-block;
            background: rgba(0, 242, 254, 0.15);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .product-title {
            font-size: 2rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .product-price-tag {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: 1.5rem;
        }

        .specs-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 1.2rem;
            margin-top: 1rem;
            color: var(--text-primary);
            line-height: 1.8;
            white-space: pre-line;
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            .product-detail-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <canvas id="capsule-canvas"></canvas>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">AMS <span class="teal-glow">Pharmacy</span></a>
            <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()">
                <i class="fas fa-moon" id="theme-icon"></i>
                <span id="theme-text">Dark</span>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <a href="index.html" style="color: var(--accent-color); text-decoration: none; font-weight: bold;">
            ← العودة للمتجر / Back to Catalog
        </a>

        <div id="product-details" class="product-detail-container">
            <p style="color: var(--text-secondary);">جاري تحميل تفاصيل المنتج...</p>
        </div>
    </main>

    <script>
    // 1. Theme Manager
    function applyTheme(theme) {
        const icon = document.getElementById('theme-icon');
        const text = document.getElementById('theme-text');
        if (theme === 'light') {
            document.body.classList.add('light-mode');
            if(icon) icon.className = 'fas fa-sun';
            if(text) text.textContent = 'Light';
        } else {
            document.body.classList.remove('light-mode');
            if(icon) icon.className = 'fas fa-moon';
            if(text) text.textContent = 'Dark';
        }
    }
    function toggleTheme() {
        const isLight = document.body.classList.contains('light-mode');
        const newTheme = isLight ? 'dark' : 'light';
        localStorage.setItem('ams_theme', newTheme);
        applyTheme(newTheme);
    }
    applyTheme(localStorage.getItem('ams_theme') || 'dark');

    // 2. Fetch Product ID from URL (?id=X)
    const urlParams = new URLSearchParams(window.location.search);
    const productId = parseInt(urlParams.get('id'));

    // 3. Connect to IndexedDB & Load Product
    const dbRequest = indexedDB.open("AMSPharmacyDB", 1);

    dbRequest.onsuccess = function(e) {
        const db = e.target.result;
        const transaction = db.transaction(["inventory"], "readonly");
        const store = transaction.objectStore("inventory");
        const request = store.get(productId);

        request.onsuccess = function() {
            const product = request.result;
            const container = document.getElementById('product-details');

            if (product) {
                const mainImg = (product.images && product.images.length > 0) ? product.images[0] : '';
                
                const thumbnailsHTML = (product.images || []).map((img, idx) => `
                    <img src="${img}" class="thumbnail ${idx === 0 ? 'active' : ''}" onclick="switchMainImage('${img}', this)" alt="thumb">
                `).join('');

                // فحص جميع الاحتمالات للوصف والمواصفات
                const specsText = product.description || product.specs || product.details || "لا توجد مواصفات إضافية مكتوبة لهذا المنتج حالياً.";

                container.innerHTML = `
                    <!-- الصور -->
                    <div>
                        <div class="main-image-box">
                            <img id="current-main-img" src="${mainImg}" alt="${product.name}">
                        </div>
                        <div class="thumbnails-row">
                            ${thumbnailsHTML}
                        </div>
                    </div>

                    <!-- معلومات المنتج والمواصفات -->
                    <div>
                        <span class="badge-cat">${product.category || 'Pharma'}</span>
                        <h1 class="product-title">${product.name}</h1>
                        <div class="product-price-tag">${product.price}</div>
                        
                        <h3 style="color: var(--accent-color); margin-top: 1.5rem; margin-bottom: 0.5rem;">
                            المواصفات والتفاصيل / Specifications:
                        </h3>
                        <div class="specs-box">
                            ${specsText}
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; color: #ef4444;">
                        <h2>المنتج غير موجود / Product Not Found</h2>
                    </div>
                `;
            }
        };
    };

    function switchMainImage(src, element) {
        document.getElementById('current-main-img').src = src;
        document.querySelectorAll('.thumbnail').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
    }
    </script>
</body>
</html>
</html>
